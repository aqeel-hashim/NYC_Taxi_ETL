repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^Assignment_1/
      - id: ruff-format
        files: ^Assignment_1/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^Assignment_1/src/
        additional_dependencies:
          - polars>=1.0
          - psycopg[binary]>=3.2
          - boto3>=1.35
          - pytest>=8.3
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.1
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, postgres]
        files: ^Assignment_1/sql/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^\.agents/
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^\.agents/|^Assignment_1/infra/aws/(bootstrap/)?\.terraform\.lock\.hcl$
      - id: trailing-whitespace
        exclude: ^\.agents/|^Assignment_1/infra/aws/(bootstrap/)?\.terraform\.lock\.hcl$
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^Assignment_1/uv\.lock$
  - repo: local
    hooks:
      - id: assignment-1-gate
        name: Assignment 1 non-kind and release gate
        entry: >-
          bash -c 'cd Assignment_1 && VERIFY_IMAGES=false ./scripts/verify.sh &&
          { branch="$(git branch --show-current)";
          [[ "${branch}" != release/* ]] || ./scripts/release-check.sh; }'
        language: system
        pass_filenames: false
        always_run: true
