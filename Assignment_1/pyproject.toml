# Python toml for dependency management and testing tooling
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_taxi_etl"]

[project]
name = "nyc-taxi-etl"
version = "0.1.0"
description = "NYC Yellow Taxi batch ETL pipeline"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "python-json-logger>=3.0",
    "boto3>=1.35",
    "botocore>=1.35",
    "pyarrow>=17.0",
    "datasketches>=5.0",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "sqlfluff>=3.3",
    "coverage>=7.6",
]
airflow = [
    "apache-airflow[statsd]>=2.10",
    "apache-airflow-providers-cncf-kubernetes>=8.4",
    "apache-airflow-providers-http>=4.13",
]
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "streamlit-plotly-events>=0.0.6",
]
webhook = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "C4",            # flake8-comprehensions
    "RUF",           # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["nyc_taxi_etl"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "polars.*",
    "datasketches.*",
    "plotly.*",
    "streamlit.*",
    "streamlit_plotly_events.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--tb=short"]

[tool.coverage.run]
source = ["nyc_taxi_etl"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
