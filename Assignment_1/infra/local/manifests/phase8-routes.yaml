apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sanitize-identity-headers
  namespace: taxi-app
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Forwarded-User: ""
      X-Forwarded-Email: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-forward-auth
  namespace: taxi-app
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/oauth2/auth
    trustForwardHeader: false
    authRequestHeaders:
      - Cookie
      - X-Forwarded-Host
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Uri
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-errors
  namespace: taxi-app
spec:
  errors:
    status: ["401-403"]
    query: /oauth2/sign_in?rd={url}
    service:
      name: oauth2-proxy
      namespace: identity
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: protected-ui
  namespace: taxi-app
spec:
  chain:
    middlewares:
      - name: sanitize-identity-headers
      - name: oauth-errors
      - name: oauth-forward-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mailpit
  namespace: taxi-app
spec:
  entryPoints: ["websecure"]
  routes:
    - match: Host(`mailpit.taxi.localhost`) && PathPrefix(`/oauth2`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: identity
          port: 80
    - match: Host(`mailpit.taxi.localhost`)
      kind: Rule
      middlewares:
        - name: protected-ui
      services:
        - name: mailpit
          port: 8025
  tls:
    secretName: taxi-tls-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alert-receiver
  namespace: taxi-app
spec:
  entryPoints: ["websecure"]
  routes:
    - match: Host(`alerts.taxi.localhost`) && PathPrefix(`/oauth2`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: identity
          port: 80
    - match: Host(`alerts.taxi.localhost`)
      kind: Rule
      middlewares:
        - name: protected-ui
      services:
        - name: alert-receiver
          port: 8000
  tls:
    secretName: taxi-tls-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow
  namespace: data-platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: airflow.taxi.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-webserver
                port:
                  number: 8080
  tls:
    - hosts: ["airflow.taxi.localhost"]
      secretName: taxi-tls-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  namespace: data-platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: minio.taxi.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-console
                port:
                  number: 9001
  tls:
    - hosts: ["minio.taxi.localhost"]
      secretName: taxi-tls-cert
