services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxi_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi_app -d taxi_warehouse"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
