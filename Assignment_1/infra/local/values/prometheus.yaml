prometheus:
  prometheusSpec:
    retention: 14d
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 1
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets: [alertmanager-webhook]
  config:
    global:
      smtp_smarthost: mailpit.taxi-app.svc.cluster.local:1025
      smtp_from: alertmanager@taxi.local
    route:
      receiver: mailpit-and-webhook
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: mailpit-and-webhook
        email_configs:
          - to: admin@taxi.local
        webhook_configs:
          - url: http://alert-receiver.taxi-app.svc.cluster.local:8000/webhook
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-webhook/token
grafana:
  enabled: true
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      label: grafana_datasource
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
