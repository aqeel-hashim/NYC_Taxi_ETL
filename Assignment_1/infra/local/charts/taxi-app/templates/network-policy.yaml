apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxi-dashboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taxi-dashboard
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8501
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data-platform
          podSelector:
            matchLabels:
              cnpg.io/cluster: taxi-warehouse
      ports:
        - protocol: TCP
          port: 5432
