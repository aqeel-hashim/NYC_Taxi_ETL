apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-strip-identity
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Auth-Request-User: ""
      X-Forwarded-User: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-forward-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-User
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth-chain
spec:
  chain:
    middlewares:
      - name: dashboard-strip-identity
      - name: dashboard-sign-in
      - name: dashboard-forward-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-sign-in
spec:
  errors:
    status:
      - "401-403"
    query: /oauth2/sign_in?rd={url}
    service:
      name: oauth2-proxy
      namespace: identity
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taxi-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: taxi-app-dashboard-auth-chain@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.taxi.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taxi-dashboard
                port:
                  name: http
  tls:
    - hosts:
        - dashboard.taxi.localhost
      secretName: taxi-tls-cert
