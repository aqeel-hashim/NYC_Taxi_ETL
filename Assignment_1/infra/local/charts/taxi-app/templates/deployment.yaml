apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxi-dashboard
  labels:
    app.kubernetes.io/name: taxi-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taxi-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxi-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: taxi-dashboard:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taxi-dashboard-database
                  key: url
            - name: HOME
              value: /tmp
            - name: TAXI_ZONE_GEOJSON
              value: /app/dashboard/data/taxi_zones.geojson
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
