name: Assignment 1 CI

on:
  push:
    branches: [develop, "feature/*"]
    paths:
      - "Assignment_1/**"
      - ".github/workflows/assignment-1-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "Assignment_1/**"

defaults:
  run:
    working-directory: Assignment_1

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@4e4d2ee8c63f5e6d8f3410cd06b003a4c76331bb  # v5.1.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: taxi_warehouse
          POSTGRES_USER: taxi_app
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@4e4d2ee8c63f5e6d8f3410cd06b003a4c76331bb  # v5.1.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: |
          sed -i 's|taxi_dev_password|test_pass|g' alembic.ini
          uv run alembic upgrade head
      - run: uv run pytest --cov --cov-branch --cov-fail-under=85
