name: Assignment 1 CI

on:
  workflow_call:
  push:
    branches: [develop, "feature/*"]
    paths:
      - "Assignment_1/**"
      - ".github/workflows/assignment-1-*.yml"
      - "renovate.json"
  pull_request:
    branches: [develop]
    paths:
      - "Assignment_1/**"
      - ".github/workflows/assignment-1-*.yml"
      - "renovate.json"

permissions:
  contents: read

concurrency:
  group: assignment-1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Assignment_1

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector@sha256:815bf5378222044da3b34d98e6a5fdac37b15c428b67d09c7c2d90a038e597bf
        env:
          POSTGRES_DB: taxi_warehouse
          POSTGRES_USER: taxi_app
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxi_app -d taxi_warehouse"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://taxi_app:ci-postgres-password@127.0.0.1:5432/taxi_warehouse
      VERIFY_IMAGES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: Assignment_1/uv.lock
      - run: ./scripts/verify.sh

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        working-directory: .
        run: >-
          docker run --rm -v "${PWD}:/repo" -w /repo
          rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d
          .github/workflows/*.yml

  scan:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: source-secrets
            scan-type: fs
            scanners: secret
          - name: dependencies
            scan-type: fs
            scanners: vuln
          - name: iac
            scan-type: config
            scanners: misconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: ${{ matrix.scan-type }}
          scan-ref: Assignment_1
          scanners: ${{ matrix.scanners }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  image-scan:
    name: Scan ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [airflow, dashboard, alert-receiver]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: Assignment_1
          file: Assignment_1/docker/${{ matrix.image }}.Dockerfile
          outputs: type=oci,dest=/tmp/${{ matrix.image }}.tar
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          input: /tmp/${{ matrix.image }}.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
