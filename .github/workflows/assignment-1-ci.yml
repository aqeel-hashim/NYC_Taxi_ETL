name: Assignment 1 CI

on:
  workflow_call:
  push:
    branches: [develop, "feature/*"]
    paths:
      - "Assignment_1/**"
      - ".github/workflows/assignment-1-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "Assignment_1/**"

defaults:
  run:
    working-directory: Assignment_1

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@4e4d2ee8c63f5e6d8f3410cd06b003a4c76331bb  # v5.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: ./scripts/verify.sh

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: taxi_warehouse
          POSTGRES_USER: taxi_app
          POSTGRES_PASSWORD: ${{ secrets.ASSIGNMENT_1_POSTGRES_PASSWORD || 'ci-postgres-password' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@4e4d2ee8c63f5e6d8f3410cd06b003a4c76331bb  # v5.1.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: |
          export TEST_DATABASE_URL="postgresql+psycopg://taxi_app:${{ secrets.ASSIGNMENT_1_POSTGRES_PASSWORD || 'ci-postgres-password' }}@127.0.0.1:5432/taxi_warehouse"
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head
          TEST_DATABASE_URL="$TEST_DATABASE_URL" ./scripts/verify.sh
