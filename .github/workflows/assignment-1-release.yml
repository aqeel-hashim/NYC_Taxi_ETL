name: Assignment 1 Release

on:
  push:
    branches: ["release/*"]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: assignment-1-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: Assignment_1

jobs:
  validate-ref:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require SemVer release tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

  ci:
    uses: ./.github/workflows/assignment-1-ci.yml
    permissions:
      contents: read

  release-smoke:
    needs: [validate-ref, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned release tools
        run: |
          ./scripts/bootstrap-tools.sh --profile core
          echo "${PWD}/.tools/bin" >> "${GITHUB_PATH}"
      - name: Run release smoke
        run: ./scripts/release-check.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-smoke-diagnostics
          path: Assignment_1/artifacts/release-diagnostics
          if-no-files-found: warn
          retention-days: 14

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build clean Assignment 1 ZIP
        run: |
          ./scripts/build-release-zip.sh "${GITHUB_REF_NAME}"
          cp "docs/release-notes-v0.1.0.md" "dist/release-notes-v0.1.0.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-package
          path: Assignment_1/dist/*
          if-no-files-found: error
          retention-days: 30

  branch-images:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: release-smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [airflow, dashboard, alert-receiver]
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: Assignment_1
          file: Assignment_1/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.architecture }}
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-${{ matrix.architecture }}.tar
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          input: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-smoke
    runs-on: ubuntu-24.04
    environment: assignment-1-release
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [airflow, dashboard, alert-receiver]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Resolve immutable image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "${GITHUB_OUTPUT}"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: Assignment_1
          file: Assignment_1/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ github.ref_name }}
            ${{ steps.names.outputs.image }}:${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: Assignment_1/${{ matrix.image }}.cyclonedx.json
          upload-artifact: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: Assignment_1/${{ matrix.image }}.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Keyless-sign image and attest SBOM
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: ${{ matrix.image }}.cyclonedx.json
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "${SBOM}" "${IMAGE}@${DIGEST}"
          printf '%s@%s\n' "${IMAGE}" "${DIGEST}" > "${{ matrix.image }}.digest.txt"
          sha256sum "${{ matrix.image }}.cyclonedx.json" "${{ matrix.image }}.spdx.json" \
            "${{ matrix.image }}.digest.txt" > "${{ matrix.image }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ matrix.image }}
          path: |
            Assignment_1/${{ matrix.image }}.cyclonedx.json
            Assignment_1/${{ matrix.image }}.spdx.json
            Assignment_1/${{ matrix.image }}.digest.txt
            Assignment_1/${{ matrix.image }}.sha256
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-smoke, package]
    runs-on: ubuntu-24.04
    environment: assignment-1-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-package
          path: Assignment_1/release-assets
          merge-multiple: true
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/Assignment_1-${GITHUB_REF_NAME}.zip \
            release-assets/Assignment_1-${GITHUB_REF_NAME}.zip.sha256 \
            --verify-tag \
            --notes-file release-assets/release-notes-v0.1.0.md \
            --title "Assignment 1 ${GITHUB_REF_NAME}"
